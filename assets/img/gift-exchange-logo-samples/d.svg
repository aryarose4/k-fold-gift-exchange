  <title id="gift-title">k-Fold Gift Exchange: sample D</title>
  <desc id="gift-desc">Random topology sample D: seven equally spaced participants and fourteen directed arrows. Every participant has exactly two incoming and two outgoing arrows. Strongly connected, without self loops, duplicate arcs, or reciprocal pairs.</desc>
