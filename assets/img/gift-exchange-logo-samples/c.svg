  <title id="gift-title">k-Fold Gift Exchange: sample C</title>
  <desc id="gift-desc">Random topology sample C: seven equally spaced participants and fourteen directed arrows. Every participant has exactly two incoming and two outgoing arrows. Strongly connected, without self loops, duplicate arcs, or reciprocal pairs.</desc>
