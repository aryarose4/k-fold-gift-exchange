    <circle data-node="4" cx="176.165392" cy="421.778272" r="15"/>
    <circle data-node="5" cx="76.613264" cy="296.943852" r="15"/>
    <circle data-node="6" cx="112.143007" cy="141.277876" r="15"/>
  </g>
</svg>
