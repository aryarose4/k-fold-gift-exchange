<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="gift-title gift-desc">
  <title id="gift-title">k-Fold Gift Exchange</title>
  <desc id="gift-desc">Seven equally spaced participants exchange gifts along a circular cycle and an interwoven star. White arrows lead one and four positions clockwise modulo seven; each participant gives to two others and receives from two others.</desc>
  <defs>
    <filter id="gift-soft-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="gift-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="22" viewBox="-18 -11 18 22" refX="0" refY="0" orient="auto" overflow="visible">
      <path d="M-17 -10 0 0-17 10-13 0Z" fill="#fff"/>
    </marker>
  </defs>
  <style>
    .gift-node { fill: #fff; stroke: none; }
  </style>
  <!-- Exact rotational repeats: node i lies at angle 2*pi*i/7 from twelve oclock.
       Edges are trimmed 28 units from both node centers; node radius is 10. -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#gift-arrow)" filter="url(#gift-soft-glow)">
    <g data-jump="4">
      <path data-source="0" data-target="4" transform="rotate(0.000000000000 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="1" data-target="5" transform="rotate(51.428571428571 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="2" data-target="6" transform="rotate(102.857142857143 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="3" data-target="0" transform="rotate(154.285714285714 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="4" data-target="1" transform="rotate(205.714285714286 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="5" data-target="2" transform="rotate(257.142857142857 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
      <path data-source="6" data-target="3" transform="rotate(308.571428571429 256 256)" d="M245.417323 97.923097 Q189.319867 240.780695 177.878340 393.830717"/>
    </g>
    <g data-jump="1">
      <path data-source="0" data-target="1" transform="rotate(0.000000000000 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="1" data-target="2" transform="rotate(51.428571428571 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="2" data-target="3" transform="rotate(102.857142857143 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="3" data-target="4" transform="rotate(154.285714285714 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="4" data-target="5" transform="rotate(205.714285714286 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="5" data-target="6" transform="rotate(257.142857142857 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
      <path data-source="6" data-target="0" transform="rotate(308.571428571429 256 256)" d="M283.918833 74.130435 A184 184 0 0 1 380.784244 120.778358"/>
    </g>
  </g>
  <g class="gift-node">
    <circle data-node="0" cx="256.000000" cy="72.000000" r="10"/>
    <circle data-node="1" cx="399.856993" cy="141.277876" r="10"/>
    <circle data-node="2" cx="435.386736" cy="296.943852" r="10"/>
    <circle data-node="3" cx="335.834608" cy="421.778272" r="10"/>
